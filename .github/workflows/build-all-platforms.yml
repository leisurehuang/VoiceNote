# 全平台桌面构建：macOS（dmg/zip）· Windows（NSIS/portable）· Linux（AppImage）
#
# 打包走 packages/desktop/electron-builder.yml（唯一构建配置）。
# resources/ 被 gitignore，CI 现场组装：三平台统一布局 resources/bin/<name>[.exe]（平铺）+
# resources/bin/lib/ollama（ollama runner）+ resources/app/{backend.cjs,frontend-dist} +
# resources/models/ggml-large-v3-turbo.bin（whisper 转写模型，三平台都带）。
# qwen 摘要模型不内置（瘦身版）：首启动由 app 内置 ollama 自动 pull。
name: Build All Platforms

on:
  push:
    tags: ['v*']          # 发布标签时触发
    branches: ['main']    # main 分支也可触发（测试用）
  pull_request:
    branches: ['main']
  workflow_dispatch:      # 允许手动触发

permissions:
  contents: write # release job 创建 release / 上传资产

jobs:
  # ==================== 三平台构建 ====================
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # TODO(临时)：诊断 Windows 失败期间只跑 windows，修复后恢复 macos/linux
          # macOS (Apple Silicon)
          # - os: macos-14
          #   platform: macos
          #   arch: arm64
          # Windows (x64)
          - os: windows-2022
            platform: windows
            arch: x64
          # Linux (x64)
          # - os: ubuntu-22.04
          #   platform: linux
          #   arch: x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      # ==================== 代码检出 + 环境 ====================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 构建前端（mac 平台 assemble-resources.sh 内部也会再跑一次，这里统一保证三平台都有 dist）
      - name: Build frontend
        run: npm run build --workspace=@voice-notes/frontend

      # tag 构建时把版本号写进 package.json（app.getVersion / electron-updater 用）。
      # 放在 npm ci 之后，避免改 package.json 导致 lockfile 校验失败。
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VER="${TAG_NAME#v}"
          echo "version=$VER"
          node -e 'const fs=require("fs");for(const p of["package.json","packages/desktop/package.json"]){const j=JSON.parse(fs.readFileSync(p,"utf8"));j.version=process.env.TAG_NAME.replace(/^v/,"");fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n")}'

      # ==================== whisper turbo 模型（三平台共用，~1.5GB，缓存）====================
      - name: Cache whisper model
        id: wmodel
        uses: actions/cache@v4
        with:
          path: ~/.voice-notes-models
          key: whisper-turbo-2026-06

      - name: Download whisper model
        if: steps.wmodel.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.voice-notes-models"
          F="$HOME/.voice-notes-models/ggml-large-v3-turbo.bin"
          for U in \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin" \
            "https://hf-mirror.com/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin"; do
            echo "下载尝试：$U"
            if curl -fL --retry 8 --retry-delay 5 -C - -o "$F" "$U"; then echo "✓ 下载成功"; break; fi
            echo "✗ 该源失败，换下一个"
          done
          ls -lh "$F" || { echo "所有源均失败"; exit 1; }

      # ==================== macOS：brew 二进制 + dylib 收拢 + 官方 ollama ====================
      - name: macOS — assemble resources
        if: matrix.platform == 'macos'
        run: |
          brew install whisper-cpp ffmpeg
          RES="$PWD/resources" SLIM=1 bash scripts/assemble-resources.sh

      # ==================== Windows：下载 ffmpeg/ollama + 编译 whisper.cpp ====================
      - name: Windows — download ffmpeg & ollama
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/bin | Out-Null

          # ffmpeg 静态构建（含 ffprobe）
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath temp_ffmpeg
          Copy-Item temp_ffmpeg/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe resources/bin/
          Copy-Item temp_ffmpeg/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe resources/bin/
          Remove-Item -Recurse -Force ffmpeg.zip, temp_ffmpeg

          # ollama：解出 ollama.exe + lib/ollama（runner 放二进制同级 lib/ollama，官方查找规则覆盖）
          Invoke-WebRequest -Uri "https://github.com/ollama/ollama/releases/download/v0.32.6/ollama-windows-amd64.zip" -OutFile ollama.zip
          Expand-Archive -Path ollama.zip -DestinationPath temp_ollama
          Copy-Item temp_ollama/ollama.exe resources/bin/
          if (Test-Path temp_ollama/lib) { Copy-Item -Recurse -Force temp_ollama/lib resources/bin/ }
          Remove-Item -Recurse -Force ollama.zip, temp_ollama
          Get-ChildItem resources/bin | Select-Object Name, Length

      - name: Windows — build whisper.cpp
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path .deps/whisper.cpp)) {
            git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git .deps/whisper.cpp
          }
          cmake -S .deps/whisper.cpp -B .build/whisper `
            -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_BUILD_TESTS=OFF `
            -DGGML_NATIVE=OFF
          cmake --build .build/whisper --config Release
          New-Item -ItemType Directory -Force -Path resources/bin | Out-Null
          $exe = @(".build/whisper/bin/Release/whisper-cli.exe", ".build/whisper/bin/whisper-cli.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "whisper-cli.exe 未找到，编译失败" }
          Copy-Item $exe resources/bin/
          Write-Host "copied $exe"

      # ==================== Linux：编译 whisper.cpp + 下载 ffmpeg/ollama ====================
      - name: Linux — build whisper.cpp
        if: matrix.platform == 'linux'
        run: |
          if [ ! -d .deps/whisper.cpp ]; then
            git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git .deps/whisper.cpp
          fi
          cmake -B .build/whisper -S .deps/whisper.cpp \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DGGML_NATIVE=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build .build/whisper -j"$(nproc)"
          mkdir -p resources/bin
          cp .build/whisper/bin/whisper-cli resources/bin/
          chmod +x resources/bin/whisper-cli

      - name: Linux — download ffmpeg & ollama
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y zstd
          mkdir -p resources/bin

          # ffmpeg 静态构建（含 ffprobe）
          curl -fL --retry 5 -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg.tar.xz
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg resources/bin/
          cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe resources/bin/
          chmod +x resources/bin/ffmpeg resources/bin/ffprobe
          rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-gpl

          # ollama：tar.zst 内是 bin/ollama + lib/ollama，解到临时目录再平铺
          curl -fL --retry 5 -o ollama.tar.zst https://github.com/ollama/ollama/releases/download/v0.32.6/ollama-linux-amd64.tar.zst
          rm -rf /tmp/ollama-extract && mkdir -p /tmp/ollama-extract
          tar --zstd -xf ollama.tar.zst -C /tmp/ollama-extract
          OLLAMA_BIN="$(find /tmp/ollama-extract -type f -name ollama | head -1)"
          [ -n "$OLLAMA_BIN" ] || { echo "ollama 二进制未找到"; exit 1; }
          cp "$OLLAMA_BIN" resources/bin/ollama
          chmod +x resources/bin/ollama
          OLLAMA_LIB="$(dirname "$OLLAMA_BIN")/lib"
          [ -d "$OLLAMA_LIB" ] || OLLAMA_LIB="$(dirname "$(dirname "$OLLAMA_BIN")")/lib"
          if [ -d "$OLLAMA_LIB" ]; then
            mkdir -p resources/bin/lib
            cp -R "$OLLAMA_LIB/." resources/bin/lib/
          fi
          rm -f ollama.tar.zst
          ls -lh resources/bin/

      # ==================== 组装资源（win/linux；mac 已由脚本完成）====================
      - name: Assemble resources (backend + frontend + whisper model)
        if: matrix.platform != 'macos'
        shell: bash
        run: |
          mkdir -p resources/app resources/models
          npm run bundle:backend
          rm -rf resources/app/frontend-dist
          mkdir -p resources/app/frontend-dist
          cp -R packages/frontend/dist/. resources/app/frontend-dist/
          cp "$HOME/.voice-notes-models/ggml-large-v3-turbo.bin" resources/models/
          ls -lh resources/app resources/bin resources/models

      # ==================== electron-builder 打包 ====================
      # 完整日志落盘：失败时作为 artifact 上传，便于排查（Actions 网页日志无法被脚本读取）
      # Windows：工作区在 D:（仅 ~14GB），打包峰值 ~9GB 会把盘写爆（表现为 electron dist
      # 拷贝阶段静默退出），因此把 release 输出指到空间更大的 C:
      - name: Build with electron-builder
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if [ "${{ matrix.platform }}" = "windows" ]; then
            (df -h /d /c || true) > build-log.txt
            npm run dist --workspace=@voice-notes/desktop -- --publish never \
              --config.directories.output="C:/vn-release" 2>&1 | tee -a build-log.txt
            (df -h /d /c || true) >> build-log.txt
          else
            npm run dist --workspace=@voice-notes/desktop -- --publish never 2>&1 | tee build-log.txt
          fi

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}-${{ matrix.arch }}
          path: build-log.txt
          retention-days: 7
          if-no-files-found: ignore

      # 把日志/现场发成 error 注解：注解可匿名读取，但每步上限 10 条，故分多个步骤各发 10 行
      - name: Emit log tail 1 (lines -40..-31)
        if: failure()
        shell: bash
        run: |
          tail -n 40 build-log.txt | sed -n '1,10p' | sed 's/%/%25/g' | while IFS= read -r line; do
            echo "::error::[log1] ${line:0:380}"
          done

      - name: Emit log tail 2 (lines -30..-21)
        if: failure()
        shell: bash
        run: |
          tail -n 40 build-log.txt | sed -n '11,20p' | sed 's/%/%25/g' | while IFS= read -r line; do
            echo "::error::[log2] ${line:0:380}"
          done

      - name: Emit log tail 3 (lines -20..-11)
        if: failure()
        shell: bash
        run: |
          tail -n 40 build-log.txt | sed -n '21,30p' | sed 's/%/%25/g' | while IFS= read -r line; do
            echo "::error::[log3] ${line:0:380}"
          done

      - name: Emit log tail 4 (lines -10..-1)
        if: failure()
        shell: bash
        run: |
          tail -n 40 build-log.txt | sed -n '31,40p' | sed 's/%/%25/g' | while IFS= read -r line; do
            echo "::error::[log4] ${line:0:380}"
          done

      - name: Emit filesystem state to annotations
        if: failure()
        shell: bash
        run: |
          {
            echo "== release dir (workspace) =="
            ls -la packages/desktop/release/ 2>/dev/null | head -8
            echo "== win-unpacked (workspace) =="
            du -sh packages/desktop/release/win-unpacked/* 2>/dev/null | head -10
            echo "== C:/vn-release =="
            ls -la /c/vn-release/ 2>/dev/null | head -8
            echo "== C:/vn-release/win-unpacked =="
            du -sh /c/vn-release/win-unpacked/* 2>/dev/null | head -10
            echo "== eb cache =="
            ls "$LOCALAPPDATA/electron-builder/Cache" 2>/dev/null | head -6
            ls "$LOCALAPPDATA/electron-builder/Cache/nsis" 2>/dev/null | head -4
          } > diag.txt
          wc -l diag.txt
          sed 's/%/%25/g' diag.txt | grep -v "^$" | sed -n '1,10p' | while IFS= read -r line; do
            echo "::error::[fs] ${line:0:380}"
          done

      # ==================== 上传产物 ====================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Notes-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            C:/vn-release/*.exe
          retention-days: 7
          if-no-files-found: error

  # ==================== 发布到 Release（仅 tag）====================
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
